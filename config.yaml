# =============================================================================
# Memo Automator Configuration
# =============================================================================
# Adjust these settings for each project / proforma-memo pair.

# --- Proforma settings ---
proforma:
  # Which Excel tabs to extract data from (order doesn't matter)
  tabs:
    - "Executive Summary"
    - "Development Summary"
    - "Cash Flow"
    - "Assumptions"
    - "Proforma Comparison"

  # Maximum rows to read per tab (0 = read all rows).
  # Keeps API payload manageable; 250 is usually more than enough.
  max_rows_per_tab: 250

  # Maximum columns to read per tab (0 = read all columns).
  max_cols_per_tab: 20

# --- Memo settings ---
memo:
  # Pages to scan for metrics. Use "all" to scan every slide in the deck,
  # or provide a list of specific page numbers, e.g. [3, 4, 6, 10, 11, 12].
  pages: "all"

# --- Claude API settings ---
claude:
  # Model for Step 4 (metric mapping). Sonnet is fast and accurate for
  # identifying which memo values map to which proforma cells.
  model: "claude-sonnet-4-6"

  # Model for Step 5 (QA validation). Opus with adaptive thinking catches
  # subtle errors that Sonnet might miss (formatting, false matches).
  # Set to same as model above to use a single model for both steps.
  validation_model: "claude-sonnet-4-6"

  # Max tokens for the API response.
  # Dense table pages (cash flow, dev budget) can produce 30K+ chars of JSON.
  max_tokens: 64000

  # Temperature (0 = deterministic; recommended for financial data).
  temperature: 0

# --- Schedule settings ---
schedule:
  max_tasks: 500

# --- Market data settings ---
market_data:
  # Maximum rows to read per tab (0 = read all rows).
  max_rows_per_tab: 250

  # Maximum columns to read per tab (0 = read all columns).
  max_cols_per_tab: 20

  # Minimum keyword hits for a tab to be included as a market data candidate.
  # Increase to be more selective; set include_all_tabs: true to bypass.
  keyword_threshold: 2

  # If true, send all tabs regardless of keyword score.
  # Use when the workbook has unusual tab names.
  include_all_tabs: false

  # --- College House SQL (live comp & market performance) ---
  # Credentials come from .env (COLLEGEHOUSE_SQL_USERNAME / _PASSWORD etc.);
  # this section only controls WHAT to pull. Any of institution / ipeds /
  # properties enables the pull for the local pipeline. The Streamlit app
  # passes these per-run from the UI instead.
  college_house:
    # institution: "University of Central Florida"
    # ipeds: 132903
    # properties: ["Hub Orlando", "Verve Orlando"]
    months_back: 24          # monthly history window for trend series
    timeout_seconds: 30      # the server is known to time out; fail soft

# --- Layout normalization ---
layout:
  margin_left: 0.50       # inches
  margin_right: 0.50
  margin_top: 0.25
  margin_bottom: 0.50
  snap_tolerance: 0.05    # inches; shapes within this delta are considered aligned

# --- Branding settings ---
branding:
  # Path to Subtext Brand Theme (.thmx). If empty, looks beside app.py.
  theme_path: ""
  heading_size_threshold: 18    # pt; >= this uses Pragmatica Bold
  color_distance_threshold: 80  # RGB Euclidean distance; skip if further
